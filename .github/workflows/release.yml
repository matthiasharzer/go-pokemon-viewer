name: Release

on:
  push:
    branches:
      - "main"

permissions:
    contents: write
    packages: write

jobs:
  get-next-version:
    name: Get next version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hasNextVersion: ${{ steps.get-next-version.outputs.hasNextVersion }}
      version: ${{ steps.get-next-version.outputs.version }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get next version
        id: get-next-version
        uses: thenativeweb/get-next-version@2.8.0

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: get-next-version

    # Don't run just after creating repo from template
    if: github.run_number != 1 && needs.get-next-version.outputs.hasNextVersion == 'true'

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Use Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ./go.mod
      - name: Run QA
        run: |
          make qa
      - name: Create new version
        run: |
          git tag v${{needs.get-next-version.outputs.version}}
          git push origin v${{needs.get-next-version.outputs.version}}
      - name: Build artifacts
        run: |
          make build BUILD_VERSION=${{ needs.get-next-version.outputs.version }}
      - name: Release new version
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/*"
          tag: v${{ needs.get-next-version.outputs.version }}
          generateReleaseNotes: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/go-pokemon-viewer:latest
            ghcr.io/${{ github.repository_owner }}/go-pokemon-viewer:${{ needs.get-next-version.outputs.version }}
          build-args: |
            version=v${{ needs.get-next-version.outputs.version }}


  deploy:
    name: Deploy Pokémon GO Stats Viewer
    runs-on: ubuntu-latest
    needs: release
    environment: production
    env:
      REMOTE_HOST: ${{ vars.REMOTE_HOST }}
      REMOTE_USER: ${{ vars.REMOTE_USER }}
      SSH_PORT: ${{ vars.REMOTE_PORT }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "$SSH_PORT" "$REMOTE_HOST" >> ~/.ssh/known_hosts
      - name: Restart Docker compose
        run: |
          ssh -p $SSH_PORT -i ~/.ssh/id_ed25519 $REMOTE_USER@$REMOTE_HOST "
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /opt/services/go-pokemon-viewer
            docker compose down
            docker compose up -d --pull=always
          "

